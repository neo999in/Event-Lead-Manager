<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181b24"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="6" y1="6" x2="26" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="10" y1="14" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#252a36" stroke-width="1"/>

  <!-- Calendar Base -->
  <g>
    <!-- Calendar Body Box -->
    <rect x="5.5" y="6.5" width="21" height="19.5" rx="3.5" fill="#0f131c" stroke="#2563eb" stroke-width="1.4"/>
    
    <!-- Top Header Strip -->
    <path d="M6 10 C6 7.5 7.5 6.5 9.5 6.5 L22.5 6.5 C24.5 6.5 26 7.5 26 10 L26 11.5 L6 11.5 Z" fill="url(#headerGrad)"/>
    <line x1="5.5" y1="11.5" x2="26.5" y2="11.5" stroke="#1d4ed8" stroke-width="1"/>

    <!-- Binder Ring Pins -->
    <rect x="9.5" y="4.25" width="2.5" height="3.75" rx="1.25" fill="#93c5fd"/>
    <rect x="20" y="4.25" width="2.5" height="3.75" rx="1.25" fill="#93c5fd"/>

    <!-- Glowing Checkmark (Lead Qualified / Active) -->
    <g filter="url(#glow)">
      <path d="M10.75 18.25 L14 21.5 L21.25 14.25" fill="none" stroke="url(#checkGrad)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
